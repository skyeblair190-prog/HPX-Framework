<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>qbx_garages</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="hidden">
    <div id="stage">
        <div id="panel">
            <div class="header">
                <div class="title">GARAGE MANAGER</div>
                <label class="search">
                    <svg viewBox="0 0 24 24" width="17" height="17"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="#fff" stroke-width="2.6"/><path d="M15.5 15.5L21 21" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/></svg>
                    <input id="search" type="text" placeholder="Search" autocomplete="off" spellcheck="false">
                </label>
            </div>
            <div class="body">
                <div class="tabs">
                    <span class="key">Q</span>
                    <div class="tab active" data-filter="all">ALL</div>
                    <div class="tab" data-filter="personal">PERSONAL</div>
                    <div class="tab" data-filter="shared">SHARED</div>
                    <span class="key">E</span>
                </div>
                <div id="grid"></div>
            </div>
        </div>

        <div id="hints">
            <span class="hint"><svg viewBox="0 0 20 20" width="15" height="15"><rect x="1" y="1" width="18" height="18" rx="3" fill="#fff"/><path d="M10 4l2.4 3H7.6zM10 16l-2.4-3h4.8zM4 10l3-2.4v4.8zM16 10l-3 2.4V7.6z" fill="#101114"/></svg><b>MOVE</b></span>
            <i></i>
            <span class="hint"><span class="key sm">Q</span><span class="slash">/</span><span class="key sm">E</span><b>SWITCH FILTER</b></span>
            <i></i>
            <span class="hint"><span class="key sm wide">ENTER</span><b>SELECT</b></span>
            <i></i>
            <span class="hint"><span class="key sm wide">ESC</span><b>CLOSE</b></span>
        </div>

        <div id="overlay" class="hidden">
            <div id="modal">
                <div class="m-head">
                    <span id="m-title">BISON</span>
                    <svg id="m-close" viewBox="0 0 24 24" width="22" height="22"><path d="M4 4L20 20M20 4L4 20" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>
                </div>
                <div class="m-body">
                    <div class="m-img"><img id="m-img" alt=""></div>
                    <div class="m-rows" id="m-rows"></div>
                </div>
                <button id="m-btn">RETRIEVE VEHICLE</button>
            </div>
        </div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
