## ─────────────────────────────────────────────────────────────
##  HPX Framework — server.cfg
##  Set sv_licenseKey below (keymaster.fivem.net).
##  Running through txAdmin? Remove the endpoint_add_* lines and
##  sv_licenseKey, txAdmin injects its own and will refuse duplicates.
## ─────────────────────────────────────────────────────────────

## Network / license
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
sv_licenseKey "changeme"
sv_endpointprivacy true

## Server identity
sv_hostname "HPX"
sets sv_projectName "HPX"
sets sv_projectDesc "HPX Framework"
sets locale "en-US"
sets tags "roleplay, serious, hpx, ox_lib, oxmysql"
# load_server_icon logo.png  # 96x96 PNG placed next to server.cfg
sv_maxclients 48

## Networking / OneSync (required: HPX reads player ped coords server-side)
set onesync on
set sv_enforceGameBuild 3258
sv_scriptHookAllowed 0
set sv_filterRequestControl 4
set sv_pureLevel 1

## Optional keys
# set steam_webApiKey ""
# sets Discord "https://discord.gg/yourinvite"

## Config includes (load order matters: ox.cfg before resources.cfg)
exec permissions.cfg
exec ox.cfg
exec resources.cfg
