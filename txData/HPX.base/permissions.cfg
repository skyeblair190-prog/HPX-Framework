## ─────────────────────────────────────────────────────────────
##  HPX Framework — permissions.cfg
##  ACE controls FXServer commands only. In-game HPX permission levels
##  (user 0 / mod 10 / admin 20 / superadmin 30 / owner 40) live in the
##  hpx_characters.permission column.
## ─────────────────────────────────────────────────────────────

## Groups
add_ace group.admin command allow
add_ace group.admin command.quit deny
add_ace group.admin command.exec deny
add_ace group.admin command.rcon deny

add_ace group.mod command.kick allow
add_ace group.mod command.ban allow
add_ace group.mod command.tp allow

add_principal group.admin group.mod

## Resource permissions
add_ace resource.hpx_core command.add_ace allow
add_ace resource.hpx_core command.remove_ace allow
add_ace resource.hpx_core command.add_principal allow
add_ace resource.hpx_core command.remove_principal allow
add_ace resource.hpx_admin command.kick allow
add_ace resource.hpx_admin command.ban allow

## Players (replace with real identifiers; find them in the txAdmin player modal)
