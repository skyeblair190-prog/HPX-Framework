## ─────────────────────────────────────────────────────────────
##  HPX Framework — ox.cfg
##  oxmysql, ox_lib and ox_inventory convars.
## ─────────────────────────────────────────────────────────────

## ── oxmysql ──────────────────────────────────────────────────
## Run setup.sql once (creates the hpx database and a native-auth hpx user).
## A MariaDB root login that uses GSSAPI auth fails in oxmysql, hence the dedicated user.
set mysql_connection_string "mysql://hpx:change_me@127.0.0.1/hpx?charset=utf8mb4"
set mysql_slow_query_warning 200
set mysql_ui false
set mysql_debug false
set mysql_transaction_isolation_level 2

## ── ox_lib ───────────────────────────────────────────────────
setr ox:locale "en"
setr ox:userLocales 1
setr ox:primaryColor "blue"
setr ox:primaryShade 8
setr ox:progressPropLimit 2
set ox:callbackTimeout 300000
set ox:txAdminNotifications 0
set ox:ignoreSecurityAdvisory ["stateBagStrictMode"]

## ── ox_inventory ─────────────────────────────────────────────
## Framework bridge: modules/bridge/hpx
setr inventory:framework "hpx"
setr inventory:slots 50
setr inventory:weight 30000
setr inventory:target false
setr inventory:itemnotify true
setr inventory:weaponnotify true
setr inventory:weaponmismatch true
setr inventory:weaponanims true
setr inventory:aimedfiring false
setr inventory:autoreload false
setr inventory:suppresspickups true
setr inventory:disableweapons false
setr inventory:dropprops false
setr inventory:enablekeys [249]
setr inventory:imagepath "nui://ox_inventory/web/images"
setr inventory:trimplate true
setr inventory:giveplayerlist false
setr inventory:disablesetupnotification false
set inventory:dropslots 50
set inventory:dropweight 30000
set inventory:dropmodel "prop_med_bag_01b"
set inventory:police ["police", "sheriff"]
set inventory:evidencegrade 2
set inventory:clearstashes "6 MONTH"
set inventory:cleartime 5
set inventory:bulkstashsave true
set inventory:networkdumpsters false
set inventory:randomloot true
set inventory:randomprices false
set inventory:shoptax 10
set inventory:enablestealcommand true
set inventory:ignoreweapons []
set inventory:versioncheck true
set inventory:loglevel 1

## ── pma-voice ────────────────────────────────────────────────
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly true
setr voice_enableUi 0
setr voice_enableRadioAnim 1
setr voice_defaultRadio false
