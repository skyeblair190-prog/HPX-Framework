sv_hostname "HPX"
sets sv_projectName "HPX"
sets sv_projectDesc "HPX Framework"
sets tags "roleplay, hpx"
sets locale "en-US"
sv_maxclients 48
set onesync on
sv_scriptHookAllowed 0
sv_enforceGameBuild 3258

set mysql_connection_string "mysql://root:@127.0.0.1/hpx?charset=utf8mb4"
set mysql_slow_query_warning 200

setr ox:locale "en"
setr inventory:framework "hpx"

add_ace group.admin command allow
add_ace group.admin command.quit deny
add_principal group.admin group.user

ensure ox_lib
ensure oxmysql
ensure interact
ensure hpx_core
ensure hpx_notify
ensure hpx_dui
ensure ox_inventory
ensure illenium-appearance
ensure hpx_banking
ensure hpx_fuel
ensure hpx_garages
ensure hpx_business
ensure hpx_evidence
ensure hpx_dispatch
ensure hpx_peddialog
ensure hpx_hud
ensure hpx_playerlist
ensure hpx_radialmenu
ensure hpx_vcontrol
ensure hpx_deathscreen
ensure hpx_admin
